# Modified by Durable Alpha, 2026: changes from the upstream commit named in NOTICE.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pushed-again PR cancels its superseded run instead of spending Actions
# minutes on a stale commit. Pushes to main group by commit instead, so a
# merge never cancels the run of the merge before it and every commit on
# main keeps its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  # Panes draw box-drawing characters and a prompt glyph through tmux. Under
  # the C locale tmux renders them as replacement characters and the waits
  # time out.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: hashFiles('extension/artifacts/worker/package.json') != ''
      - name: Test artifacts worker
        if: hashFiles('extension/artifacts/worker/package.json') != ''
        working-directory: extension/artifacts/worker
        run: bun test

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  # internal/ui is over a third of the suite's test time and ran last, behind
  # every other package's compile. It gets runners of its own, split by test
  # name, while the rest of the module runs beside it. Separate runners rather
  # than more processes on one: the ui tests assert latencies, and
  # scripts/shard-test.sh records them failing under in-box concurrency.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rest
            cache: rest
            save-cache: true
          - shard: ui-0
            cache: ui
            save-cache: true
          - shard: ui-1
            cache: ui
            save-cache: false
    env:
      SHARD: ${{ matrix.shard }}
      UI_SHARDS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-go's own cache is keyed on go.sum alone, so once an entry exists
      # it never saves again, and the check job saves it first, without any
      # test binaries. This job keeps its own build cache instead: each push
      # to main saves one keyed by commit, and every run restores the newest.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ matrix.cache }}-
            go-test-${{ runner.os }}-
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux
      # Nearly every test that drives a pane skips itself when tmux is
      # missing, so without it the job would pass having run almost none of
      # the suite. The report job's skip check is the other half of that guard.
      - name: Verify tmux and scratch space
        run: |
          tmux -V
          df -h /dev/shm
      # Tests that launch the claude tool resolve its binary before a fake
      # launcher takes over, and never run it. A stub that fails when invoked
      # satisfies the lookup without letting a test that does exec it pass by
      # accident.
      - name: Stub the claude CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "stub claude invoked in CI: $*" >&2\nexit 1\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A ui shard takes every UI_SHARDS-th name of the sorted test list,
      # dealt round-robin as scripts/shard-test.sh does, because neighbouring
      # names usually share a file and a slow file would otherwise land on one
      # runner. Each shard uploads the whole list so the report job can prove
      # the shards between them ran all of it.
      - name: Select tests
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          case "$SHARD" in
          rest)
            go list ./... | grep -vx 'github.com/usestring/gate-inbox/internal/ui' > "$out/packages.txt"
            ;;
          ui-*)
            # Listing runs TestMain, which starts a tmux server, so it is
            # isolated like the run itself.
            scripts/test-tmux-isolation.sh -- go test -list '.*' ./internal/ui |
              grep '^Test' | sort > "$out/ui-tests.txt"
            awk -v k="$UI_SHARDS" -v i="${SHARD#ui-}" 'NR % k == i' "$out/ui-tests.txt" > "$RUNNER_TEMP/mine.txt"
            test -s "$RUNNER_TEMP/mine.txt"
            echo "$(wc -l < "$RUNNER_TEMP/mine.txt") of $(wc -l < "$out/ui-tests.txt") internal/ui tests"
            ;;
          esac
      # The suite runs with TMUX pointed at a sentinel server, the environment
      # a test run inherits inside an operator's tmux pane, and the step fails
      # if that server loses or gains anything: internal/tmuxtest gives every
      # test binary its own TMUX_TMPDIR, and this proves nothing escaped it.
      # The sqlite fixtures go to /dev/shm through tmuxtest.ScratchDir.
      #
      # This step fails on go test's own verdict. The skip verdict needs every
      # shard's stream at once, so it belongs to the report job.
      - name: Test
        run: |
          out="$RUNNER_TEMP/out"
          case "$SHARD" in
          rest) mapfile -t args < "$out/packages.txt" ;;
          ui-*) args=(-run "^($(paste -sd'|' "$RUNNER_TEMP/mine.txt"))\$" ./internal/ui) ;;
          esac
          scripts/test-tmux-isolation.sh -- \
            go test -json -count=1 -timeout 15m "${args[@]}" > "$out/test.json"
      # A failing test leaves the compiled binaries just as reusable, and with
      # the suite this flaky, saving only after a green run would leave the
      # cache days old. The two ui shards compile the same thing, so one saves.
      - name: Save Go build cache
        if: ${{ !cancelled() && matrix.save-cache && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Upload test stream
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-json-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  # One verdict over the union of the shards' streams. testreport has to see
  # every test at once: an allowlisted skip that ran in another shard would
  # otherwise read as never seen.
  #
  # Both verdicts have to be clean: go test alone would call a suite that
  # passed by skipping a success, and testreport alone would miss a failure
  # that never reached the stream.
  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-json-*
          path: ${{ runner.temp }}/streams
      - name: Report
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          streams="$RUNNER_TEMP/streams"
          cat "$streams"/test-json-*/test.json > "$RUNNER_TEMP/test.json"

          # The shards' selections are checked rather than trusted: a test
          # that no shard ran is coverage lost with no skip to report it.
          covered=0
          lists=("$streams"/test-json-ui-*/ui-tests.txt)
          if [ "${#lists[@]}" -eq 2 ] && cmp -s "${lists[0]}" "${lists[1]}"; then
            jq -r 'select(.Action == "run" and .Package == "github.com/usestring/gate-inbox/internal/ui" and (.Test | contains("/") | not)) | .Test' \
              "$RUNNER_TEMP/test.json" | sort -u > "$RUNNER_TEMP/ui-ran.txt"
            if comm -23 "${lists[0]}" "$RUNNER_TEMP/ui-ran.txt" | grep .; then
              echo "::error::the internal/ui tests above ran in no shard"
              covered=1
            fi
          else
            echo "::error::expected two identical internal/ui test lists, found ${#lists[@]}"
            covered=1
          fi

          go build -o "$RUNNER_TEMP/testreport" ./tools/testreport
          report=0
          "$RUNNER_TEMP/testreport" \
            -allow ci-allowed-skips.txt \
            -summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/test.json" || report=$?
          echo "test jobs: $TEST_RESULT"
          test "$TEST_RESULT" = success -a "$covered" -eq 0 -a "$report" -eq 0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The release binary rather than gitleaks-action, which needs a
      # licence key on organisation repositories.
      - name: Install gitleaks
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # The whole history, not just this change: it is published with the
      # repository.
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml .'
