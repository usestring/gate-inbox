# Secret scan for this repository, run by .github/workflows/ci.yml over the
# full history. The history goes public with the repository, so a finding
# anywhere in it matters, not only in the latest tree.
#
# Every allowlist entry names one fixture and the value it carries. A new
# fixture that trips a rule gets its own entry here rather than a wider one.

[extend]
useDefault = true

# The scrubber's test feeds it an opaque, made-up value under a credential
# variable name to prove the name alone is enough to redact it.
[[allowlists]]
description = "internal/logging redaction test: fake GITHUB_TOKEN value"
paths = ['''^internal/logging/redact_test\.go$''']
regexTarget = "match"
regexes = ['''GITHUB_TOKEN=0123456789abcdef''']

# The child-question relay test puts a made-up value under a credential
# variable name in a fake permission prompt, to prove the relay strips it.
# Scoped to the one commit that carries it, rather than the value, so the
# config does not repeat it.
[[allowlists]]
description = "internal/ui child-question relay test: fake API_TOKEN value"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["e8200eb2bb8d1e8cf6ec799fcd0443978e51cade"]
paths = ['''^internal/ui/childquestion_test\.go$''']

# The JEV key-paste test first spelled its made-up keys with a random-looking
# tail. A later commit renamed them to plain fake values; this entry covers the
# one commit that still carries the old spelling.
[[allowlists]]
description = "internal/ui JEV key-paste test: fake JEV API key values"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["9aec9032e69089d20e2008a83dfaa0b7c302fb2c"]
paths = ['''^internal/ui/jevkey_test\.go$''']
