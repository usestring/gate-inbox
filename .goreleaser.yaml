# Modified by Durable Alpha, 2026: changes from the upstream commit named in NOTICE.

version: 2

project_name: gate-inbox

before:
  hooks:
    - go mod verify

builds:
  - id: gate-inbox
    main: .
    binary: gate-inbox
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# release-please publishes the release with its notes before goreleaser runs.
# goreleaser finds it by tag, keeps its notes and attaches the archives. A tag
# pushed by hand gets a new release with GitHub's notes.
release:
  draft: false
  mode: keep-existing
  prerelease: auto
