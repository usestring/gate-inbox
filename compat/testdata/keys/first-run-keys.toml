# Gate Inbox key bindings.
#
# One table per screen, one line per action: the keys it answers to. What is
# not written here keeps its default, and an empty list unbinds an action
# that is not required. Key names are the ones the key map screen prints:
# plain letters, "enter", "esc", "alt+o", "ctrl+q".
#
# Press ? in the board for the whole list of actions, and rebind from there
# rather than by hand if you would rather not look a name up. Anything this
# file gets wrong is reported on the board at startup and falls back to its
# default, so a typo here never costs you the list.

# [list]
# cursor_up           = ["up", "k"]  # move the cursor up (cannot be unbound)
# cursor_down         = ["down", "j"]  # move the cursor down (cannot be unbound)
# cursor_top          = []  # jump to the top of the list
# cursor_bottom       = []  # jump to the bottom
# open                = ["enter"]  # focus the session, or fold the group (cannot be unbound)
# step_in             = ["right"]  # step in: a session's work, then focus it
# step_out            = ["left"]  # step out: fold the work, close the group
# last_pane           = ["l"]  # focus the session you were on before this one; l again swaps back
# jump_pane           = ["ctrl+g"]  # find a pane by name and focus it
# rescind_submission  = ["ctrl+z"]  # undo the latest submission while its turn is active
# jump_attention      = ["tab"]  # enter the next session waiting on you
# jump_waiting        = []  # enter the next waiting session
# jump_finished       = []  # enter the next finished session
# jump_errored        = []  # enter the next errored or dead session
# jump_idle           = []  # enter the next idle session
# jump_working        = []  # enter the next working session
# attach              = ["A", "shift+a"]  # attach: the pane takes the terminal
# reorder_up          = ["K", "shift+k", "shift+up"]  # reorder the row up
# reorder_down        = ["J", "shift+j", "shift+down"]  # reorder the row down
# preview_scroll_up   = ["alt+up"]  # scroll the preview up
# preview_scroll_down = ["alt+down"]  # scroll the preview down
# preview_page_up     = []  # scroll the preview a page up
# preview_page_down   = []  # scroll the preview a page down
# preview_top         = []  # scroll the preview to its oldest
# preview_bottom      = []  # scroll the preview back to live
# new_session         = ["n"]  # new session: asks which agent, unless settings names one
# new_session_form    = ["ctrl+n"]  # new session, asking name, CLI, directory, task
# new_group           = ["g"]  # new group
# new_terminal        = ["T", "shift+t"]  # new terminal tab
# fork                = []  # fork the session into a new one
# migrate             = []  # migrate it to another CLI
# revive              = ["v"]  # revive it, or restart a live one on its own conversation
# revive_all          = []  # revive every dead session
# switch_account      = []  # switch its account: restarts it on its own conversation
# restart             = []  # restart it on an empty context
# archive             = ["x"]  # kill it and file the row
# archive_all         = []  # kill every session listed
# restore             = ["u"]  # restore it out of the archive
# dismiss             = ["."]  # skip
# priority            = ["p"]  # cycle priority: urgent → high → medium → low → none
# quick_prompt        = [" ", "space", "ctrl+]"]  # hotkey menu
# rename_from_agent   = ["r"]  # rename it after its conversation
# rename              = []  # rename it yourself, and re-pick its tool
# name_sweep          = []  # name sweep over idle adopted panes
# take_over           = []  # take over the adopted panes now; busy ones once they go idle
# move                = ["m"]  # move it to a group
# show_all_work       = []  # show every pull request and ticket, not the first few
# status_filter       = ["w"]  # filter to what needs attention
# triage              = ["i"]  # triage this group as one queue
# toggle_conversation = ["f3"]  # show full / shortened conversation
# empty_groups        = []  # hide / show empty groups
# fold_all            = []  # fold / unfold everything
# archived_view       = []  # archived view
# search              = ["/"]  # fuzzy session search
# clear_search        = []  # clear the search
# resize_split        = []  # resize the split
# settings            = ["s"]  # settings
# toggle_chrome       = []  # hide / show the key hints along the foot
# toggle_rail         = []  # hide / show the list beside the pane
# legend_peek         = ["?"]  # peek at every available key
# quick_actions       = [":", "ctrl+p"]  # quick actions: find any action by name, run it, see its key
# help                = ["h", "H", "shift+h", "ctrl+h"]  # this key map (cannot be unbound)
# quit                = ["q"]  # quit (sessions keep running) (cannot be unbound)

# [focus]
# leave               = ["ctrl+q"]  # back to the manager; in triage, on to the next (cannot be unbound)
# hand_over           = ["§"]  # ctrl+q's one-press alias
# leave_stop          = ["ctrl+\\"]  # back to the manager, always stopping there (cannot be unbound)
# rescind_submission  = ["ctrl+z"]  # undo the latest submission while its turn is active
# dismiss             = ["alt+."]  # skip
# toggle_conversation = ["f3"]  # show the conversation or the terminal
# toggle_chrome       = ["alt+,"]  # hide / show the key hints along the foot
# toggle_rail         = ["alt+\\"]  # hide / show the list beside the pane
# archive             = ["ctrl+x"]  # kill it, asking first
# help                = ["ctrl+h"]  # this key map
# quick_prompt        = ["ctrl+]"]  # hotkey menu: send a snippet without leaving the session
# new_session         = ["alt+n"]  # new session in this one's group
# copy_session_id     = ["alt+y"]  # copy the agent's session id
# last_pane           = ["alt+l"]  # back to the previous session; alt+l again swaps back
# jump_pane           = ["ctrl+g"]  # find a pane by name and focus it
# leave_at_prompt     = ["right", "left"]  # at a prompt edge, leave; in triage Right advances a finished one
# preview_scroll_up   = ["alt+up"]  # scroll the pane up
# preview_scroll_down = ["alt+down"]  # scroll the pane down
# preview_page_up     = ["alt+u", "alt+pgup"]  # scroll a page up
# preview_page_down   = ["alt+d", "alt+pgdown"]  # scroll a page down
# preview_top         = ["alt+home"]  # oldest history
# preview_bottom      = ["alt+end"]  # back to the live bottom

# [name_sweep]
# cancel      = ["esc", "n", "q"]  # cancel the sweep (cannot be unbound)
# cursor_up   = ["up", "k"]  # move up (cannot be unbound)
# cursor_down = ["down", "j"]  # move down (cannot be unbound)
# page_up     = ["ctrl+u", "pgup"]  # a page up
# page_down   = ["ctrl+d", "pgdown"]  # a page down
# confirm     = ["y", "enter"]  # run the sweep (cannot be unbound)

# [restore]
# cancel      = ["esc", "n", "q"]  # leave everything as it is (cannot be unbound)
# more        = ["c"]  # choose per session
# never_ask   = ["N", "shift+n"]  # apply this answer and stop asking
# cursor_up   = ["up", "k"]  # move up (cannot be unbound)
# cursor_down = ["down", "j"]  # move down (cannot be unbound)
# toggle      = [" ", "space"]  # tick / untick the row
# tick_all    = ["a"]  # tick every row, or start over
# confirm     = ["y", "enter"]  # apply: resume the ticked sessions, answer the panes (cannot be unbound)

# [welcome]
# close       = ["enter", "esc", "q", " ", "space"]  # close the guide (cannot be unbound)
# help        = ["h", "H", "?", "shift+h", "ctrl+h"]  # the key map
# cursor_up   = ["up", "k"]  # move up (cannot be unbound)
# cursor_down = ["down", "j"]  # move down (cannot be unbound)
# page_up     = ["ctrl+u", "pgup"]  # a page up
# page_down   = ["ctrl+d", "pgdown"]  # a page down
# top         = ["g", "home"]  # the top
# bottom      = ["G", "end"]  # the bottom

# [confirm]
# toggle  = [" ", "space"]  # answer the tick
# confirm = ["y", "enter"]  # go ahead (cannot be unbound)
